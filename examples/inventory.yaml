# hostwarden fleet inventory. Addresses below are RFC 5737 documentation IPs.
defaults:
  user: audit                     # account that can run `sudo -n` (see README)
  port: 22
  identity_file: ~/.ssh/id_ed25519 # unencrypted key; otherwise use ssh-agent
  known_hosts: ~/.ssh/known_hosts  # host keys are always verified
  sudo: true
  args: ["--exclude", "HW-KRN-003"]

hosts:
  - name: web-1
    address: 192.0.2.10
  - name: web-2
    address: 192.0.2.11
  - name: db-1
    address: 198.51.100.20
    user: ops
    args: ["--baseline", "/etc/hostwarden/baseline.json"]
