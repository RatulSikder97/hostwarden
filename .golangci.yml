version: "2"

run:
  timeout: 5m
  build-tags:
    - integration

linters:
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nolintlint
    - noctx
    - revive
    - unconvert
    - usestdlibvars
  settings:
    gosec:
      excludes:
        # hostwarden is an auditor: reading arbitrary host paths is its job.
        - G304
        # Probe commands (apt-get -s, dnf updateinfo, docker in tests) take fixed argv.
        - G204
        # Fleet mode verifies host keys via knownhosts; tests use in-process servers.
        - G106
    revive:
      rules:
        - name: exported
        - name: var-naming
        - name: indent-error-flow
        - name: errorf
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: (_test\.go|internal/testutil/)
        linters:
          - gosec
          - noctx

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/RatulSikder97/hostwarden
